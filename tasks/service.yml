---
# roles/consul/service.yml
- name: Add consul
  ansible.builtin.apt:
    name: consul
    state: present

- name: Install | Ensure agent certificate directory
  become: true
  ansible.builtin.file:
    path: "{{ consul_certs_dir }}"
    state: directory
    owner: consul
    group: consul
    mode: "0777"

- name: Install | Ensure Logging directory
  become: true
  ansible.builtin.file:
    path: "{{ consul_log_dir }}"
    state: directory
    mode: "0777"
    owner: consul
    group: consul

- name: Add Consul template to Vault-Agent
  ansible.builtin.copy:
    src: etc/vault-agent.d/consul-agent.hcl
    dest: /etc/vault-agent.d/consul-agent.hcl
    owner: root
    group: root
    mode: "0644"

- name: Deliver Vault Agent templates
  ansible.builtin.template:
    src: etc/vault.d/consul-agent.hcl.tmpl.j2
    dest: /etc/vault-agent.d/consul-agent.hcl.tmpl
    variable_start_string: "[["
    variable_end_string: "]]"
    owner: root
    group: root
    mode: "0644"

  notify: Vault Agent Service

# Tasks that configure the systemd unit and start the service
- name: Service | Ensure that systemd dir is present
  become: true
  ansible.builtin.file:
    path: /usr/lib/systemd/system
    state: directory
    owner: root
    group: root
    mode: "0644"

- name: Service | Template systemd unit
  become: true
  ansible.builtin.template:
    src: etc/systemd/system/consul.service.j2
    dest: /etc/systemd/system/consul.service
    owner: root
    group: root
    mode: "0644"
    variable_start_string: "[["
    variable_end_string: "]]"
  notify: Consul Agent Service

- name: Service | Ensure consul is enabled
  become: true
  ansible.builtin.systemd:
    name: consul
    state: started
    enabled: true
    masked: false
    daemon_reload: true

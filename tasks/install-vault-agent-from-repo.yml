- name: Ensure Vault Agent Directory
  ansible.builtin.file:
    path: /etc/vault-agent.d
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Add Vault
  ansible.builtin.apt:
    name: vault
    state: present

- name: Ensure Default Vault directory not present
  ansible.builtin.file:
    path: /etc/vault.d
    owner: root
    group: root
    mode: "0755"
    state: absent

- name: Vault Agent | Deliver role id
  ansible.builtin.copy:
    dest: "{{ vault_agent_config_dir }}/vault_roleid"
    content: "{{ lookup('community.hashi_vault.vault_kv2_get','consul',  engine_mount_point='hashiatho.me-v2').data.data['vault_agent_role_id'] }}"
    backup: true
    force: true
    mode: "0644"
    owner: root
    group: root

- name: Vault Agent | Template Vault Agent template
  ansible.builtin.template:
    src: etc/vault-agent.hcl.j2
    dest: "{{ vault_agent_config_dir }}/vault-agent.hcl"
    backup: true
    mode: "0644"
    owner: root
    group: root

---
name: main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "commitlint.config.js"
      - ".releaserc.yaml"
      - ".ansible-lint"
      - ".config/**"
      - ".secrets.baseline"
      - "CHANGELOG.md"
jobs:
  lint:
    name: Static Checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dev Tools
        uses: jdx/mise-action@v5
        with:
          install: true
      - name: Lint
        uses: ansible-lint .
  build:
    continue-on-error: true
    needs:
      - lint
    name: Build Images
    permissions: write-all
    env:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    services:
      vault:
        image: "public.ecr.aws/hashicorp/vault:2.1.1"
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ${{ secrets.VAULT_TOKEN }}
        options: >-
          --health-cmd "VAULT_ADDR=http://0.0.0.0:8200 vault status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ".github/build/"
    strategy:
      fail-fast: false
      matrix:
        target:
          - "consul.docker.ubuntu-amd64"
          - "consul.docker.ubuntu-arm64"
          - "consul.arm.raspi-os-64"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mise en Place
        uses: jdx/mise-action@v5
        with:
          install: true
          experimental: true
          cache: true
      - name: Get Prerequisites
        # should be mise bootstrap
        run: |
          sudo apt-get install -y \
          binfmt-support \
          gzip \
          qemu-system \
          qemu-user-static
          unzip \
      - name: Init Packer
        run: packer init .
      - name: Build Image (PR)
        shell: 'script -q -e -c "bash {0}"'
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          export run_as
          if [[ "${{ matrix.target }}" == "consul.arm.raspi-os-64" ]]; then
            run_as="sudo -E env PATH=${PATH}"
          else
            run_as=""
          fi
          eval "$run_as" packer build \
            -var roles_path="${GITHUB_WORKSPACE}/../" \
            -var docker_password=${{ secrets.GITHUB_TOKEN }} \
            -var tag_version="pr-${{ github.event.pull_request.number }}" \
            -only=${{ matrix.target }} \
            consul.pkr.hcl
      - name: Build Image
        shell: 'script -q -e -c "bash {0}"'
        if: ${{ github.ref_name == 'main' }}
        run: |
          export run_as
          if [[ "${{ matrix.target }}" == "consul.arm.raspi-os-64" ]] ; then
            run_as="sudo -E env PATH=${PATH}"
          else
            run_as=""
          fi
          eval "$run_as" packer build \
            -var roles_path="${GITHUB_WORKSPACE}/../" \
            -var docker_password=${{ secrets.GITHUB_TOKEN }} \
            -var tag_version="latest" \
            -only=${{ matrix.target }} \
            consul.pkr.hcl
      - name: Compress artifact
        if: ${{ matrix.target == 'consul.arm.raspi-os-64' }}
        run: sudo xz -T 9 --compress raspios-bullseye.img
      - name: Upload artifact
        if: ${{ matrix.target == 'consul.arm.raspi-os-64' }}
        uses: actions/upload-artifact@v7
        with:
          name: raspi-os-64
          path: .github/build/raspios-bullseye.img.xz
  test-pr:
    continue-on-error: true
    needs:
      - build
    name: Test PR
    runs-on: ubuntu-26.04
    services:
      vault:
        image: "public.ecr.aws/hashicorp/vault:2.1.2"
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ${{ secrets.VAULT_TOKEN }}
        options: >-
          --health-cmd "VAULT_ADDR=http://0.0.0.0:8200 vault status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    if: github.event_name == 'pull_request'
    container:
      image: ghcr.io/brucellino/ansible-role-consul/consul-ubuntu-amd64:pr-${{ github.event.pull_request.number }}
      env:
        VAULT_ADDR: http://vault:8200
        VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mise en Place
        uses: jdx/mise-action@v5
        with:
          install: true
          experimental: true
          cache: true
      - name: Vault login
        run: vault login ${{ secrets.VAULT_TOKEN }}
      - name: Enable KV engine
        run: vault secrets enable --path kv kv-v2
      - name: Create gossip key
        run: vault kv put kv/consul-test gossip_key=$(consul keygen)
      - name: Create Certificates
        run: consul tls ca create
      - name: Put the certs in the Vault
        run: >-
          cat consul-agent-ca.pem
          | vault kv patch kv/consul-test ca_cert=- ;
          cat consul-agent-ca-key.pem
          | vault kv patch kv/consul-test ca_key=-
      - name: Create server certs
        run: consul tls cert create -server -dc dc1 -domain consul

  test:
    needs:
      - build
    name: Test main
    runs-on: ubuntu-latest
    services:
      vault:
        # vault tag should be a global var
        image: "public.ecr.aws/hashicorp/vault:2.1.2"
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ${{ secrets.VAULT_TOKEN }}
        options: >-
          --health-cmd "VAULT_ADDR=http://0.0.0.0:8200 vault status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    if: github.ref_name == 'main' && github.ref_type == 'branch'
    container:
      image: ghcr.io/brucellino/ansible-role-consul/consul-ubuntu-amd64:latest
      env:
        VAULT_ADDR: http://vault:8200
        VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mise en Place
        uses: jdx/mise-action@v5
        with:
          install: true
          experimental: true
          cache: true
      - name: Vault login
        run: vault login ${{ secrets.VAULT_TOKEN }}
      - name: Enable KV engine
        run: vault secrets enable --path kv kv-v2
      - name: Create gossip key
        run: vault kv put kv/consul-test gossip_key=$(consul keygen)
      - name: Create Certificates
        run: consul tls ca create
      - name: Put the certs in the Vault
        run: >-
          cat consul-agent-ca.pem
          | vault kv patch kv/consul-test ca_cert=- ;
          cat consul-agent-ca-key.pem
          | vault kv patch kv/consul-test ca_key=-
      - name: Create server certs
        run: consul tls cert create -server -dc dc1 -domain consul

  release:
    needs:
      - lint
      - build
      - test
    name: Release
    if: github.ref_name == 'main' && github.ref_type == 'branch'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get os image
        uses: actions/download-artifact@v8
        with:
          name: raspi-os-64
      - name: add semantic release plugins
        run: |
          npm install -D semantic-release \
                         '@semantic-release/changelog' \
                         '@semantic-release/github' \
                         '@semantic-release/git'
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
